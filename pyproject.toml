[project]
name = "sphinx-skos"
description = "A Sphinx extension that builds SKOS vocabularies into a documentation site, one page per concept"
license = "MIT"
version = "0.1.0"
readme = "README.md"
authors = [{ name = "Sam", email = "samuel.scott.jennings@gmail.com" }]
requires-python = ">=3.12"
keywords = ["sphinx", "skos", "rdf", "vocabulary", "linked-data"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Sphinx",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Documentation",
    "Topic :: Documentation :: Sphinx",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "sphinx>=9.0",
]

[project.urls]
homepage = "https://github.com/FAIR-DM/sphinx-skos"
repository = "https://github.com/FAIR-DM/sphinx-skos"
documentation = "https://github.com/FAIR-DM/sphinx-skos#readme"
changelog = "https://github.com/FAIR-DM/sphinx-skos/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pydoclint>=0.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sphinx_skos"]

[tool.hatch.build.targets.sdist]
include = ["/sphinx_skos", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.coverage.run]
branch = true
source = ["sphinx_skos"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.extend-per-file-ignores]
# Asserts are how pytest tests assert.
"tests/**" = ["S101"]

[tool.mypy]
files = ["sphinx_skos"]
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.deptry]
extend_exclude = ["tests/", "docs/"]
